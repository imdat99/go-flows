name: release

# After the ci workflow passes on a push to main (a merged pull request), tag
# the next semantic version of that commit and publish a GitHub release, so
# that
#   go get github.com/imdat99/go-flows@vX.Y.Z   (or @latest)
# installs it. Nothing is tagged if any CI job (lint, unit/integration and
# chaos tests, performance budget) fails.
#
# The version comes from the commit messages since the last tag
# (.github/scripts/next-version.sh): feat -> minor, fix and others -> patch,
# "type!:" or "BREAKING CHANGE" -> major (minor while below v1.0.0).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: # re-run the release for the current main (no CI check)

permissions:
  contents: read

# One release at a time, in merge order: two merges in a row must not compute
# the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only a successful CI run for a push to main (not a pull request run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # history and tags, to compute the version

      - name: Next version
        id: version
        run: |
          # CI runs can finish out of order: a later commit may already be
          # released, and its tag then contains this one.
          if git tag --contains HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "A newer release already contains this commit; nothing to tag." >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(.github/scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "HEAD is already released; nothing to tag." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag and publish the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          {
            echo "Released **$TAG**:"
            echo
            echo '```'
            echo "go get $(awk '/^module /{print $2}' go.mod)@$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Announce the version to the Go module proxy
        if: steps.version.outputs.tag != ''
        # A public module is then installable at once (instead of on the first
        # `go get`). Private repositories are not on the public proxy: users
        # set GOPRIVATE=github.com/<owner>/* and this step is allowed to fail.
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          module=$(awk '/^module /{print $2}' go.mod)
          curl -fsS "https://proxy.golang.org/${module}/@v/${TAG}.info"
