version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - chaos
    - upgrade

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    # security and resources
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - fatcontext
    - rowserrcheck
    # logging
    - sloglint
    - loggercheck
    # testing
    - thelper
    - usetesting
    # modernization and meta
    - modernize
    - intrange
    - usestdlibvars
    - nolintlint
    # architecture
    - depguard

  settings:
    depguard:
      rules:
        # Direct dependencies are an allowlist (AGENTS.md): Go modules have no
        # test-only dependencies, so tests are covered too.
        deps:
          list-mode: lax
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the standard testing package (dependency allowlist)
            - pkg: github.com/riverqueue
              desc: the engine has its own queue (decision 2026-11-15)
        # The library core must not depend on its optional add-ons or on apps.
        core:
          files:
            - "!**/idem/**"
            - "!**/examples/**"
            - "!**/test/**"
            - "!$test"
            - "!**/migrate.go"
            - "!**/internal/store/pg/migrate.go"
          deny:
            - pkg: github.com/imdat99/go-flows/idem
              desc: idem is a module-side helper, the core must not need it
            - pkg: github.com/imdat99/go-flows/examples
              desc: the library must not import example code
            - pkg: database/sql
              desc: use pgx/v5 (database/sql only inside Migrate for goose)
    errcheck:
      check-type-assertions: true
    gocyclo:
      min-complexity: 20
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: unexported-return
        - name: context-as-argument
        - name: blank-imports
    gosec:
      excludes:
        - G115 # integer overflow conversions: values here are bounded (seq, attempts)
    sloglint:
      attr-only: true

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Conformance cases are table entries taking *testing.T, not helpers:
      # t.Helper() would hide the failing line.
      - path: internal/store/storetest/
        linters:
          - thelper
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forcetypeassert

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/imdat99/go-flows
